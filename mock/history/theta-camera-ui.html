(()=>{const root=document.getElementById('theta-ui');const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];let seq=4,mode='camera',rec=false,recAt=0,audio=false,audioAt=0,scan=false,timer=0,front=false,flash=false,penDirty=false,libFilter='all',album='',sheetPurpose='active',backFocus=null;const albums=['20261108 レゴランド'];const items=Array.from({length:4},(_,i)=>({id:i+1,type:'写真',album:'',secret:false,note:'',at:'14:'+String(22+i).padStart(2,'0')}));const selected=new Set();let toastId,countdownId;function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('#tc-toast').textContent=s;$('#tc-toast').hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>$('#tc-toast').hidden=true,2800)}function clock(ms){const n=Math.floor(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function visibleItems(){return items.filter(x=>libFilter==='all'?!x.secret:libFilter==='secret'?x.secret:!x.secret&&x.album===libFilter)}function update(){const latest=items.filter(x=>!x.secret).slice(-5);$('#tc-thumbs').innerHTML=latest.map(x=>`<button class="tc-thumb ${selected.has(x.id)?'selected':''}" data-id="${x.id}" draggable="true" aria-pressed="${selected.has(x.id)}" aria-label="${x.type} ${x.at}を選択"><span class="type">${x.type==='写真'?x.at:esc(x.type)}</span>${selected.has(x.id)?'<span class="tc-check">✓</span>':''}</button>`).join('');$('#tc-total').textContent=items.length;$('#tc-currentalbum').textContent=album||'未整理 · アルバムを選ぶ';$('#tc-traylabel').textContent=selected.size?`${selected.size}件を選択 · 下の送り先へ`:'直近の記録 · 選んで下の送り先へ';$('#tc-selectedcount').textContent=selected.size?`${selected.size}件を選択中`:'写真を選んで整理';$('#tc-libfilters').innerHTML=[['all','すべて'],['','未整理'],...albums.map(a=>[a,a]),['secret','Secret']].map(([v,l])=>`<button data-filter="${esc(v)}" class="${libFilter===v?'active':''}">${esc(l)}</button>`).join('');const vis=visibleItems();$('#tc-grid').innerHTML=vis.map(x=>`<button class="tc-tile ${selected.has(x.id)?'selected':''}" data-id="${x.id}" aria-pressed="${selected.has(x.id)}"><span>${x.secret?'非公開':esc(x.type)} ${selected.has(x.id)?'✓':''}</span><b>${x.at}</b><small>${x.album?esc(x.album):'未整理'}</small></button>`).join('');if(!vis.length)$('#tc-grid').innerHTML='<div class="tc-empty">まだ記録がありません</div>';icons()}
function add(type){const now=new Date();const it={id:++seq,type,album,secret:false,note:'',at:now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})};items.push(it);selected.clear();selected.add(it.id);update();return it}function photoNow(){add(scan?'書類':'写真');$('#tc-flash').classList.remove('fire');void $('#tc-flash').offsetWidth;$('#tc-flash').classList.add('fire');toast(rec?'写真を記録しました。動画は撮影中です':(album||'未整理')+'に記録しました')}function toggleVideo(){rec=!rec;$('#tc-record').classList.toggle('recording',rec);$('#tc-recordlabel').textContent=rec?'停止':'動画';$('#tc-record').setAttribute('aria-label',rec?'動画撮影を停止':'動画撮影を開始');$('#tc-recstatus').hidden=!rec;if(rec){recAt=Date.now();$('#tc-rectime').textContent='00:00';toast('録画開始。上の写真ボタンも使えます')}else{add('動画');toast('動画を記録しました')}}
function showSheet(title,content){backFocus=document.activeElement;$('#tc-sheettitle').textContent=title;$('#tc-sheetbody').innerHTML=content;$('#tc-scrim').hidden=false;icons();$('.tc-close').focus()}function close(){if($('#tc-scrim').hidden)return;$('#tc-scrim').hidden=true;backFocus?.focus?.()}function albumSheet(purpose){sheetPurpose=purpose;showSheet(purpose==='active'?'これから撮るアルバム':purpose==='manage'?'アルバムを管理':'選んだ記録をアルバムへ',`<p>${purpose==='active'?'この後の記録から適用します。撮影済みの記録は一覧から追加できます。':purpose==='manage'?'名前を変えたり、新しいアルバムを作れます。':`${selected.size}件の記録をまとめます。`}</p>${purpose==='active'?'<button class="tc-choice" data-setalbum="">未整理に戻す <span>自動追加を終了</span></button>':''}${albums.map((a,i)=>`<button class="tc-choice ${album===a?'active':''}" ${purpose==='manage'?`data-rename="${i}"`:`data-setalbum="${esc(a)}"`}>${esc(a)} <span>${purpose==='manage'?'編集':'選ぶ'}</span></button>`).join('')}<label for="tc-newalbum">新しいアルバム</label><input class="tc-field" id="tc-newalbum" value="20261108 レゴランド" aria-label="新しいアルバム名"><div class="tc-sheetrow"><button class="tc-primary" data-action="create-album">作成${purpose==='manage'?'':'して使う'}</button></div>`)}function setAlbum(a){if(sheetPurpose==='active')album=a;else if(sheetPurpose==='assign'){items.forEach(x=>{if(selected.has(x.id))x.album=a});selected.clear()}close();update();toast(sheetPurpose==='active'?(a?`これからの記録 → ${a}`:'未整理への記録に戻しました'):'アルバムに追加しました')}function needSelection(){if(selected.size)return true;toast('先に記録を選んでください');return false}function route(name){if(!needSelection())return;if(name==='album')albumSheet('assign');if(name==='memo')showSheet('この記録にメモを添える',`<p>${selected.size}件の記録に添付します。</p><textarea id="tc-attachtext" class="tc-field" placeholder="例：観覧車からの景色。二人とも大喜び。" aria-label="添付するメモ"></textarea><div class="tc-sheetrow"><button class="tc-primary" data-action="attach">メモを添付</button></div>`);if(name==='secret')showSheet('Secretへ移す',`<p>${selected.size}件を非公開の一覧へ移します。このモックでは分類だけを体験できます。</p><div class="tc-sheetrow"><button class="tc-primary" data-action="make-secret">Secretに保管</button></div>`)}
function setMode(m){if(rec&&m!=='camera'){toast('動画の停止後に切り替えられます');return}if(audio&&m!=='audio'){add('音声');audio=false;toast('音声を保存して切り替えました')}mode=m;['camera','audio','text','pen','library'].forEach(n=>$('#tc-'+n).hidden=n!==m);$$('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',b.dataset.mode===m)});if(m==='audio'&&!audio){audio=true;audioAt=Date.now();$('#tc-audiobtn').textContent='■';$('#tc-audiohint').textContent='録音中 · 停止すると記録に追加'}if(m==='text')$('#tc-textinput').focus();if(m==='pen')sizeCanvas();if(m==='library')update()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.id){const id=Number(b.dataset.id);selected.has(id)?selected.delete(id):selected.add(id);update();return}if(b.dataset.mode){setMode(b.dataset.mode);return}if(b.dataset.zoom){$$('[data-zoom]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});$('#tc-previewhint').textContent=(b.dataset.zoom==='0.6'?'ULTRA WIDE':'ZOOM')+' / '+b.dataset.zoom+'×';return}if(b.hasAttribute('data-filter')){libFilter=b.dataset.filter;selected.clear();update();return}if(b.dataset.route){route(b.dataset.route);return}if(b.hasAttribute('data-setalbum')){setAlbum(b.dataset.setalbum);return}if(b.hasAttribute('data-rename')){const idx=Number(b.dataset.rename);showSheet('アルバム名を変更',`<label for="tc-rename">アルバム名</label><input class="tc-field" id="tc-rename" value="${esc(albums[idx])}"><button class="tc-primary" data-rename-save="${idx}">変更する</button>`);return}if(b.hasAttribute('data-rename-save')){const i=Number(b.dataset.renameSave),v=$('#tc-rename').value.trim();if(!v)return;const prev=albums[i];if(albums.includes(v)&&v!==prev){toast('同じ名前のアルバムがあります');return}albums[i]=v;items.forEach(x=>{if(x.album===prev)x.album=v});if(album===prev)album=v;if(libFilter===prev)libFilter=v;close();update();toast('アルバム名を変更しました');return}switch(b.dataset.action){case'photo':if(timer&&!rec){if(countdownId)return;let n=timer;$('#tc-countdown').hidden=false;$('#tc-countdown').textContent=n;countdownId=setInterval(()=>{n--;if(n){$('#tc-countdown').textContent=n}else{clearInterval(countdownId);countdownId=null;$('#tc-countdown').hidden=true;photoNow()}},1000)}else photoNow();break;case'video':toggleVideo();break;case'flash':flash=!flash;b.classList.toggle('active',flash);b.innerHTML=`<i data-lucide="${flash?'zap':'zap-off'}"></i>`;icons();toast('フラッシュ '+(flash?'ON':'OFF'));break;case'timer':timer=timer?0:3;$('#tc-timervalue').textContent=timer?'3秒':'OFF';break;case'quality':if(rec){toast('録画を停止してから画質を変更できます');break}b.textContent=b.textContent==='1080p'?'4K':'1080p';break;case'fps':if(rec){toast('録画を停止してから変更できます');break}b.textContent=b.textContent==='30 fps'?'60 fps':'30 fps';break;case'scan':scan=!scan;b.classList.toggle('active',scan);b.setAttribute('aria-pressed',scan);$('#tc-scanbox').hidden=!scan;break;case'flip':if(rec){toast('録画中は現在のカメラを使います');break}front=!front;toast(front?'前面カメラへ':'背面カメラへ');break;case'album':albumSheet('active');break;case'library':if(rec){toast('動画を停止すると一覧を開けます');break}setMode('library');break;case'back':setMode('camera');break;case'manage-albums':albumSheet('manage');break;case'assign-selected':if(needSelection())albumSheet('assign');break;case'close':close();break;case'create-album':{const v=$('#tc-newalbum').value.trim();if(!v){toast('アルバム名を入力してください');break}if(!albums.includes(v))albums.push(v);if(sheetPurpose==='manage'){close();update();toast('アルバムを作成しました')}else setAlbum(v);break}case'attach':{const v=$('#tc-attachtext').value.trim();if(!v){toast('メモを入力してください');break}items.forEach(x=>{if(selected.has(x.id))x.note=v});close();toast('選んだ記録にメモを添えました');break}case'make-secret':items.forEach(x=>{if(selected.has(x.id))x.secret=true});selected.clear();close();update();toast('Secretへ移しました。一覧のSecretから見られます');break;case'save-text':{const v=$('#tc-textinput').value.trim();if(!v){toast('文字を入力してください');break}const it=add('テキスト');it.note=v;$('#tc-textinput').value='';toast('テキストを記録しました');break}case'undo-pen':clearPen();break;case'save-pen':if(!penDirty){toast('白紙です。先に書き込んでください');break}add('手書き');clearPen();toast('手書きを記録しました');break;case'audio-toggle':if(audio){audio=false;add('音声');$('#tc-audiobtn').textContent='●';$('#tc-audiobtn').setAttribute('aria-label','録音を開始');$('#tc-audiohint').textContent='保存しました · 押すと新しい録音';toast('音声を記録しました')}else{audio=true;audioAt=Date.now();$('#tc-audiobtn').textContent='■';$('#tc-audiobtn').setAttribute('aria-label','録音を停止');$('#tc-audiohint').textContent='録音中 · 停止すると記録に追加'}break;case'settings':showSheet('撮り始めを、自分仕様に',`<p>このモックでは動画と写真を同じ画面に常設しています。</p><button class="tc-choice" data-action="rear-selfie">外側画面で自撮り <span>切替</span></button><div class="tc-choice">起動時の倍率 <span>0.6× 広角</span></div><div class="tc-choice">DIMPLE 1–4 <span>カメラ／音声／文字／メモ</span></div><p style="margin-top:15px">録画、NFC接続、暗号化は実行しません。</p>`);break;case'rear-selfie':close();toast('外側画面＋背面カメラでの自撮りを想定した切替です');break}});
$('#tc-scrim').addEventListener('click',e=>{if(e.target===$('#tc-scrim'))close()});root.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!$('#tc-scrim').hidden){const fs=[...$('.tc-sheet').querySelectorAll('button,input,textarea')];const first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});root.addEventListener('dragstart',e=>{const b=e.target.closest('[data-id]');if(b){const id=Number(b.dataset.id);if(!selected.has(id)){selected.clear();selected.add(id)}e.dataTransfer.setData('text/plain',String(id));e.dataTransfer.effectAllowed='move'}});$$('[data-route]').forEach(b=>{b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('dragover')});b.addEventListener('dragleave',()=>b.classList.remove('dragover'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('dragover');update();route(b.dataset.route)})});
const canvas=$('#tc-canvas'),ctx=canvas.getContext('2d');let drawing=false;function sizeCanvas(){const r=canvas.getBoundingClientRect();if(r.width&&Math.abs(canvas.width-r.width*2)>2){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=r.width*2;canvas.height=r.height*2;ctx.drawImage(old,0,0,canvas.width,canvas.height)}ctx.strokeStyle='#35512c';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round'}function point(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}function clearPen(){ctx.clearRect(0,0,canvas.width,canvas.height);penDirty=false;$('#tc-penhint').hidden=false}canvas.addEventListener('pointerdown',e=>{drawing=true;penDirty=true;$('#tc-penhint').hidden=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.stroke()});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);new ResizeObserver(()=>{if(mode==='pen')sizeCanvas()}).observe(canvas);$('#tc-bars').innerHTML=Array.from({length:37},(_,i)=>`<span style="--h:${12+(Math.sin(i*1.9)**2)*57}px"></span>`).join('');setInterval(()=>{if(!root.isConnected)return;if(rec)$('#tc-rectime').textContent=clock(Date.now()-recAt);if(audio)$('#tc-audiotime').textContent=clock(Date.now()-audioAt)},500);update();
})();

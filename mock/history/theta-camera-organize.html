(()=>{const root=document.getElementById('theta-organize'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];const scene='<div class="to-scene"><div class="to-sun"></div><div class="to-wheel"></div><div class="to-hill"></div><div class="to-hill second"></div><div class="to-person"></div><div class="to-person second"></div></div>';const lenses=['超広角 · 0.6×','広角 · 1×','望遠 · 3×','インカメラ'];const folders=[{id:'family',name:'家族写真'},{id:'work',name:'仕事写真'},{id:'inbox',name:'未整理'},{id:'secret',name:'Secret'}];let items=Array.from({length:4},(_,i)=>({id:i+1,type:i===3?'動画':'写真',duration:i===3?24:0,folder:i===0?'lego':'inbox',time:'14:'+String(21+i),text:'',voice:0,pen:null,lens:0}));let seq=4,destination='family',lens=0,multi=false,library=false,filter='all',rec=null,recStart=0,recDestination='',timer=0,scan=null,level=true,flash=0,toastId,prevFocus=null,audioActive=false,audioStart=0,audioDuration=0,editIds=[],penDirty=false,penCanvas=null,ctx=null,drawing=false,penDraft=null,countdown=null,skipClick=false,holdId=null,holdButton=null,held=false,drag=null,dual=false,voiceShutter=false;const selected=new Set();const recordings=new Map();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}})}function clock(ms){const n=Math.floor(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function folderName(id){return folders.find(x=>x.id===id)?.name||'未整理'}function toast(s){$('#to-toast').textContent=s;$('#to-toast').hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>$('#to-toast').hidden=true,2600)}function miniBadge(x){const e=edits.get(x.id);return [e?.text?'文字':x.text?'文字':'',e?.voices.length?'声':x.voice?'声':'',e?.strokes.length?'手書き':x.pen?'手書き':'',e?.hasCut?'カット':'',e?.saved?'編集版':''].filter(Boolean).join(' · ')}function repaint(){const recent=items.filter(x=>x.folder!=='secret').slice(-5);$('#to-strip').innerHTML=recent.map(x=>`<button class="to-thumb ${x.type==='動画'?'video-thumb':''} ${selected.has(x.id)?'selected':''}" data-id="${x.id}" data-drag="true" aria-label="${x.type} ${x.time}をプレビューして編集" aria-pressed="${selected.has(x.id)}"><span>${x.type==='写真'?x.time:esc(x.type)}</span>${selected.has(x.id)?'<b>✓</b>':miniBadge(x)?'<b class="to-edittag">編</b>':''}</button>`).join('')+`<button class="to-thumbmore" data-action="library" aria-label="全記録を開く">${items.length}<br>一覧</button>`;$('#to-context').innerHTML=selected.size?`<span class="to-selected">${selected.size}件</span><div class="to-tools"><button data-action="move"><i data-lucide="folder-input"></i>振分</button><button data-action="text"><i data-lucide="type"></i>文字</button><button data-action="voice"><i data-lucide="mic"></i>声</button><button data-action="pen"><i data-lucide="pen-line"></i>手書き</button></div>`:'<span class="to-hint">下の写真を押す → その場で書き込む</span>';$('#to-saving').textContent='保存先 › '+folderName(destination);$('#to-folders').innerHTML=folders.map(f=>`<button class="to-folder ${destination===f.id?'current':''}" data-folder="${f.id}" aria-label="${esc(f.name)}。長押しで今後の保存先に設定" aria-pressed="${destination===f.id}"><span>${esc(f.short||f.name)}</span><small>${destination===f.id?'● 保存先':items.filter(x=>x.folder===f.id).length+'件'}</small></button>`).join('')+'<button class="to-folder add" data-action="newfolder" aria-label="フォルダを追加">＋</button>';$('#to-filter').innerHTML=[{id:'all',name:'すべて'},...folders].map(f=>`<button data-filter="${f.id}" class="${filter===f.id?'active':''}">${esc(f.short||f.name)}</button>`).join('');const visible=items.filter(x=>filter==='all'?x.folder!=='secret':x.folder===filter);$('#to-grid').innerHTML=visible.map(x=>`<button class="to-item ${selected.has(x.id)?'selected':''}" data-id="${x.id}" aria-pressed="${selected.has(x.id)}"><span>${esc(x.type)} ${selected.has(x.id)?'✓':''}</span><span>${x.time}</span><small>${esc(folderName(x.folder))}</small>${miniBadge

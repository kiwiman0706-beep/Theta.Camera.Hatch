(()=>{const root=document.getElementById('theta-overlay'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];const scene='<div class="to-scene"><div class="to-sun"></div><div class="to-wheel"></div><div class="to-hill"></div><div class="to-hill second"></div><div class="to-person"></div><div class="to-person second"></div></div>';const lenses=['超広角 · 0.6×','広角 · 1×','望遠 · 3×','インカメラ'];const folders=[{id:'inbox',name:'未整理'},{id:'lego',name:'20261108 レゴランド',short:'レゴランド'},{id:'memo',name:'メモ'},{id:'secret',name:'Secret'}];let items=Array.from({length:4},(_,i)=>({id:i+1,type:'写真',folder:i===0?'lego':'inbox',time:'14:'+String(21+i),text:'',voice:0,pen:null,lens:0}));let seq=4,destination='inbox',lens=0,multi=false,library=false,filter='all',rec=null,recStart=0,recDestination='',timer=0,scan=null,level=true,flash=0,toastId,prevFocus=null,audioActive=false,audioStart=0,audioDuration=0,editIds=[],penDirty=false,penCanvas=null,ctx=null,drawing=false,penDraft=null,countdown=null,skipClick=false,holdId=null,holdButton=null,held=false,drag=null,dual=false,voiceShutter=false;const selected=new Set();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}})}function clock(ms){const n=Math.floor(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function folderName(id){return folders.find(x=>x.id===id)?.name||'未整理'}function toast(s){$('#to-toast').textContent=s;$('#to-toast').hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>$('#to-toast').hidden=true,2600)}function miniBadge(x){return [x.text?'文字':'',x.voice?'声':'',x.pen?'手書き':''].filter(Boolean).join(' · ')}function repaint(){const recent=items.filter(x=>x.folder!=='secret').slice(-5);$('#to-strip').innerHTML=recent.map(x=>`<button class="to-thumb ${selected.has(x.id)?'selected':''}" data-id="${x.id}" data-drag="true" aria-label="$ function showLibrary(v=true){library=v;$('#to-library').hidden=!v;if(v){$('#to-exposure').hidden=true;repaint()}}function moveTo(id){if(!selected.size){toast('写真を選ぶか、フォルダを長押ししてください');return}items.forEach(x=>{if(selected.has(x.id))x.folder=id});toast(`${selected.size}件を ${folderName(id)} へ移しました`);selected.clear();repaint()}function saveDestination(id){destination=id;toast('これからの保存先 → '+folderName(id));$('#to-saving').textContent='保存先 › '+folderName(id);$$('[data-folder]').forEach(b=>{const active=b.dataset.folder===id;b.classList.toggle('current',active);b.setAttribute('aria-pressed',active);b.querySelector('small').textContent=active?'● 保存先':items.filter(x=>x.folder===b.dataset.folder).length+'件'})}
function showSheet(title,html){prevFocus=document.activeElement;$('#to-title').textContent=title;$('#to-body').innerHTML=html;$('#to-modal').hidden=false;icons();$('.to-sheethead button').focus()}function closeSheet(){if(audioActive){toast('音声メモは録音中です。停止または添付してから閉じてください');return}$('#to-modal').hidden=true;penCanvas=null;ctx=null;prevFocus?.focus?.()}function need(){if(selected.size)return true;toast('先に写真を選んでください');return false}function openEditor(kind){if(!need())return;editIds=[...selected];const x=items.find(y=>y.id===editIds[0]);if(kind==='text')showSheet('写真にテキストメモ',`<p>${editIds.length}件の記録に添付</p><textarea class="to-input" id="to-text" aria-label="テキストメモ" placeholder="例：観覧車にもう一度乗りたいそう。">${esc(x.text)}</textarea><div class="to-row"><button class="to-primary" data-action="save-text">添付する</button></div>`);if(kind==='voice'){audioActive=false;audioDuration=0;showSheet('写真に音声メモ',`<p>${editIds.length}件に添付 · 録音操作のデモ</p><div class="to-audiobox"><div class="to-wave">${Array.from({length:33},(_,i)=>`<span style="--h:${10+Math.sin(i*1.6)**2*40}px"></span>`).join('')}</div><div class="to-clock" id="to-audiotime">00:00</div><button class="to-audiobtn" data-action="voice-toggle" id="to-voicebtn" aria-label="音声メモを開始・停止">●</button></div><div class="to-row"><button class="to-primary" data-action="save-voice">音声を添付</button></div>`)}if(kind==='pen'){penDirty=Boolean(x.pen);penDraft=x.pen;showSheet('写真に直接、書き込む',`<p>原本を残して、書き込みを添えます。</p><div class="to-editorpreview">${scene}<canvas id="to-canvas" aria-label="写真への手書き入力面"></canvas><span class="to-editorhint" id="to-penhint">ペン・指でここに書き込めます</span></div><div class="to-row"><button class="to-secondary" data-action="clear-pen">書き直す</button><button class="to-primary" data-action="save-pen">書き込みを保存</button></div>`);requestAnimationFrame(initPen)}}function initPen(){penCanvas=$('#to-canvas');if(!penCanvas)return;const r=penCanvas.getBoundingClientRect();penCanvas.width=r.width*2;penCanvas.height=r.height*2;ctx=penCanvas.getContext('2d');ctx.strokeStyle='#f5dc5c';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';if(penDraft){const image=new Image();image.onload=()=>{if(ctx)ctx.drawImage(image,0,0,penCanvas.width,penCanvas.height)};image.src=penDraft}const point=e=>{const r=penCanvas.getBoundingClientRect();return[(e.clientX-r.left)*penCanvas.width/r.width,(e.clientY-r.top)*penCanvas.height/r.height]};penCanvas.onpointerdown=e=>{drawing=true;penDirty=true;$('#to-penhint').hidden=true;penCanvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};penCanvas.onpointermove=e=>{if(drawing){ctx.lineTo(...point(e));ctx.stroke()}};penCanvas.onpointerup=penCanvas.onpointercancel=()=>drawing=false}
function dualSheet(){if(rec===3){toast('インカメラの録画を停止してから背面自撮りへ切り替えます');return}if(lens===3){lens=0;paintCamera()}showSheet('開いたまま、どちら側でも撮る',`<p>内外プレビューの構想です。Fold5での同時表示・操作は実機確認が必要です。</p><div class="to-duals"><div class="to-dual">${scene}<span class="to-dualname">内側 · 背面カメラ映像</span><button data-action="dual-photo" aria-label="内側画面でシャッター"><i data-lucide="camera"></i></button></div><div class="to-dual cover">${scene}<span class="to-dualname">外側</span><button data-action="dual-photo" aria-label="外側画面でシャッター"><i data-lucide="camera"></i></button></div></div><div class="to-note">持ち替え中はシャッター以外の操作をロックする案</div><button class="to-choice" data-action="dual-auto" id="to-dual-auto">開いた状態で起動 → 両面表示 <span>${dual?'ON':'OFF'}</span></button>`)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(skipClick){skipClick=false;e.preventDefault();return}if(b.dataset.id){const id=+b.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);repaint();return}if(b.hasAttribute('data-folder')){if(held){held=false;return}if(selected.size)moveTo(b.dataset.folder);else{filter=b.dataset.folder;showLibrary();}return}if(b.dataset.filter){filter=b.dataset.filter;selected.clear();repaint();return}if(b.hasAttribute('data-lens')){const n=+b.dataset.lens;if(rec!==null&&rec!==n){toast('録画中のレンズは維持します');return}lens=n;scan=null;paintCamera();return}if(b.hasAttribute('data-pane-photo')){photo(+b.dataset.panePhoto);return}if(b.hasAttribute('data-pane-video')){video(+b.dataset.paneVideo);return}if(b.dataset.move){moveTo(b.dataset.move);closeSheet();return}switch(b.dataset.action){case'voice-shutter':voiceShutter=!voiceShutter;$('#to-voiceshutter').classList.toggle('active',voiceShutter);$('#to-voiceshutter').setAttribute('aria-pressed',voiceShutter);$('#to-voiceshutter span').textContent=voiceShutter?'声 ON':'声 OFF';$('#to-saycheese').hidden=!voiceShutter;toast(voiceShutter?'「はいチーズ」で撮影する設定です。下のボタンで動作を試せます':'声シャッターをOFFにしました');break;case'say-cheese':if(voiceShutter){if(scan){toast('声シャッターは通常の写真撮影で使います');break}photo(rec??lens)}break;case'photo':photo();break;case'video':video();break;case'library':showLibrary();break;case'back':showLibrary(false);break;case'flash':flash=(flash+1)%3;b.innerHTML=`<i data-lucide="${flash?'zap':'zap-off'}"></i><span>${['OFF','AUTO','ON'][flash]}</span>`;icons();break;case'timer':timer=timer===0?3:timer===3?10:0;$('#to-timervalue').textContent=timer?timer+'秒':'OFF';break;case'exposure':$('#to-exposure').hidden=!$('#to-exposure').hidden;break;case'evclose':$('#to-exposure').hidden=true;break;case'level':level=!level;$('#to-levelbtn').classList.toggle('active',level);$('#to-levelbtn').setAttribute('aria-pressed',level);paintCamera();break;case'quality':if(rec!==null){toast('録画停止後に画質を変更できます');break}b.textContent=b.textContent==='1080p'?'4K':'1080p';break;case'fps':if(rec!==null){toast('録画停止後に変更できます');break}b.textContent=b.textContent==='30 fps'?'60 fps':'30 fps';break;case'multi':multi=!multi;scan=null;paintCamera();break;case'dual':dualSheet();break;case'dual-auto':dual=!dual;$('#to-dual-auto span').textContent=dual?'ON':'OFF';toast('起動時の両面表示：'+(dual?'ON':'OFF')+'（設定のデモ）');break;case'dual-photo':snap(rec??lens);break;case'scan':if(rec!==null){toast('録画を停止してからスキャンを開始できます');break}showSheet('スキャンする',`<button class="to-choice" data-action="scan-doc"><span>文書スキャン</span><i data-lucide="file-scan"></i></button><button class="to-choice" data-action="scan-qr"><span>QRスキャン</span><i data-lucide="qr-code"></i></button>${scan?'<button class="to-choice" data-action="scan-off">通常カメラに戻る</button>':''}`);break;case'scan-doc':scan='doc';multi=false;closeSheet();paintCamera();toast('文書モード。写真ボタンで取り込み');break;case'scan-qr':scan='qr';multi=false;closeSheet();paintCamera();toast('QRモード。写真ボタンで読み取りデモ');break;case'scan-off':scan=null;closeSheet();paintCamera();break;case'qr-save':{const x=add('QR');x.text='レゴランドの入園メモ（デモ）';closeSheet();repaint();toast('読み取り結果を記録しました');break}case'newfolder':showSheet('フォルダを追加',`<label for="to-foldername">フォルダ名</label><input class="to-input" id="to-foldername" placeholder="例：20261108 レゴランド"><div class="to-row"><button class="to-primary" data-action="create-folder">追加する</button></div>`);break;case'create-folder':{const name=$('#to-foldername').value.trim();if(!name){toast('名前を入力してください');break}if(folders.some(f=>f.name===name)){toast('同名のフォルダがあります');break}folders.push({id:'f'+Date.now(),name});closeSheet();repaint();toast('フォルダを追加しました');break}case'move':if(need())showSheet('選んだ写真を振り分け',folders.map(f=>`<button class="to-choice" data-move="${f.id}">${esc(f.name)} <span>移す</span></button>`).join(''));break;case'text':openEditor('text');break;case'voice':openEditor('voice');break;case'pen':openEditor('pen');break;case'save-text':{const value=$('#to-text').value.trim();items.forEach(x=>{if(editIds.includes(x.id))x.text=value});closeSheet();repaint();toast('テキストメモを保存しました');break}case'voice-toggle':audioActive=!audioActive;if(audioActive){audioStart=Date.now();$('#to-audiotime').textContent='00:00';$('#to-voicebtn').textContent='■'}else{audioDuration=Date.now()-audioStart;$('#to-voicebtn').textContent='●'}break;case'save-voice':if(audioActive){audioDuration=Date.now()-audioStart;audioActive=false}if(!audioDuration){toast('録音ボタンを押してから添付してください');break}items.forEach(x=>{if(editIds.includes(x.id))x.voice=audioDuration});closeSheet();repaint();toast('音声メモを添付しました');break;case'clear-pen':if(ctx){ctx.clearRect(0,0,penCanvas.width,penCanvas.height);penDirty=false}break;case'save-pen':if(!penDirty){toast('先に書き込んでください');break}{const v=penCanvas.toDataURL();items.forEach(x=>{if(editIds.includes(x.id))x.pen=v});closeSheet();repaint();toast('原本を残して、書き込みを保存しました')}break;case'close':closeSheet();break}});
$('#to-ev').addEventListener('input',e=>{const v=Number(e.target.value),s=(v>0?'+':'')+v.toFixed(1)+' EV';$('#to-evread').textContent=s;$('#to-evvalue').textContent=s;$('#to-main-scene').style.filter='brightness('+(1+v*.14)+')'});$('#to-modal').addEventListener('click',e=>{if(e.target===$('#to-modal'))closeSheet()});root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();$('#to-exposure').hidden=true}if(e.key==='Tab'&&!$('#to-modal').hidden){const a=[...$('.to-sheet').querySelectorAll('button,input,textarea')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function cancelHold(){clearTimeout(holdId);holdId=null;holdButton?.classList.remove('holding');holdButton=null}function startHold(b){cancelHold();held=false;holdButton=b;b.classList.add('holding');holdId=setTimeout(()=>{held=true;saveDestination(b.dataset.folder);holdButton=null;holdId=null},550)}root.addEventListener('contextmenu',e=>{if(e.target.closest('[data-folder]'))e.preventDefault()});root.addEventListener('pointerdown',e=>{const folder=e.target.closest('[data-folder]');if(folder){startHold(folder);return}const thumb=e.target.closest('[data-drag]');if(thumb){drag={id:+thumb.dataset.id,x:e.clientX,y:e.clientY,moved:false,el:thumb,ghost:null};thumb.setPointerCapture(e.pointerId)}});root.addEventListener('pointermove',e=>{if(holdButton){const r=holdButton.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)cancelHold()}if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){drag.moved=true;drag.ghost=document.createElement('div');drag.ghost.className='to-ghost';$('#to-screen').appendChild(drag.ghost)}if(drag.moved){const r=$('#to-screen').getBoundingClientRect();drag.ghost.style.left=e.clientX-r.left-23+'px';drag.ghost.style.top=e.clientY-r.top-23+'px';const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-folder]');$$('[data-folder]').forEach(b=>b.classList.toggle('target',b===target))}});root.addEventListener('pointerup',e=>{cancelHold();if(drag?.moved){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-folder]');drag.ghost?.remove();skipClick=true;if(target){if(!selected.has(drag.id)){selected.clear();selected.add(drag.id)}moveTo(target.dataset.folder)}else toast('下のフォルダへドロップしてください');$$('[data-folder]').forEach(b=>b.classList.remove('target'));setTimeout(()=>skipClick=false,350)}drag=null});root.addEventListener('pointercancel',()=>{cancelHold();drag?.ghost?.remove();drag=null;$$('[data-folder]').forEach(b=>b.classList.remove('target'))});root.addEventListener('keydown',e=>{const b=e.target.closest('[data-folder]');if(b&&e.key===' '&&!e.repeat){e.preventDefault();startHold(b)}});root.addEventListener('keyup',e=>{const b=e.target.closest('[data-folder]');if(b&&e.key===' '){e.preventDefault();const wasHeld=held;cancelHold();held=false;if(!wasHeld){if(selected.size)moveTo(b.dataset.folder);else{filter=b.dataset.folder;showLibrary()}}}});
let lastTap={id:null,time:0};$('#to-multi').addEventListener('click',e=>{if(e.target.closest('button'))return;const p=e.target.closest('[data-pane]');if(!p)return;const id=+p.dataset.pane,now=Date.now();if(lastTap.id===id&&now-lastTap.time<350){if(rec!==null&&rec!==id){toast('録画中のカメラは切り替えません');return}lens=id;multi=false;paintCamera();toast(lenses[id]+' を全画面にしました');lastTap={id:null,time:0}}else lastTap={id,time:now}});
setInterval(()=>{if(!root.isConnected)return;if(rec!==null)$('#to-rectime').textContent=clock(Date.now()-recStart);if(audioActive&&$('#to-audiotime'))$('#to-audiotime').textContent=clock(Date.now()-audioStart)},500);repaint();paintCamera();
})();

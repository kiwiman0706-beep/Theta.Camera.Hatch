root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(skipClick){skipClick=false;e.preventDefault();return}if(b.dataset.id){const id=+b.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);repaint();return}if(b.hasAttribute('data-folder')){if(held){held=false;return}if(selected.size)moveTo(b.dataset.folder);else{filter=b.dataset.folder;showLibrary();}return}if(b.dataset.filter){filter=b.dataset.filter;selected.clear();repaint();return}if(b.hasAttribute('data-lens')){const n=+b.dataset.lens;lens=n;scan=null;paintCamera();return}if(b.hasAttribute('data-pane-photo')){photo(+b.dataset.panePhoto);return}if(b.hasAttribute('data-pane-video')){video(+b.dataset.paneVideo);return}if(b.dataset.move){moveTo(b.dataset.move);closeSheet();return}switch(b.dataset.action){case'voice-shutter':voiceShutter=!voiceShutter;$('#to-voiceshutter').classList.toggle('active',voiceShutter);$('#to-voiceshutter').setAttribute('aria-pressed',voiceShutter);$('#to-voiceshutter span').textContent=voiceShutter?'声 ON':'声 OFF';$('#to-saycheese').hidden=!voiceShutter;toast(voiceShutter?'「はいチーズ」で撮影する設定です。下のボタンで動作を試せます':'声シャッターをOFFにしました');break;case'say-cheese':if(voiceShutter){if(scan){toast('声シャッターは通常の写真撮影で使います');break}photo(rec??lens)}break;case'photo':photo();break;case'video':video();break;case'library':showLibrary();break;case'back':showLibrary(false);break;case'flash':flash=(flash+1)%3;b.innerHTML=`<i data-lucide="${flash?'zap':'zap-off'}"></i><span>${['OFF','AUTO','ON'][flash]}</span>`;icons();break;case'timer':timer=timer===0?3:timer===3?10:0;$('#to-timervalue').textContent=timer?timer+'秒':'OFF';break;case'exposure':$('#to-exposure').hidden=!$('#to-exposure').hidden;break;case'evclose':$('#to-exposure').hidden=true;break;case'level':level=!level;$('#to-levelbtn').classList.toggle('active',level);$('#to-levelbtn').setAttribute('aria-pressed',level);paintCamera();break;case'quality':if(rec!==null){toast('録画停止後に画質を変更できます');break}b.textContent=b.textContent=
